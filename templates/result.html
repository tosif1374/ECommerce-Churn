<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prediction Result</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #43cea2, #185a9d);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    padding: 40px;
    width: 90%;
    max-width: 500px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
}

h1 {
    margin-bottom: 15px;
}

.churn {
    color: #e74c3c;
}

.no-churn {
    color: #2ecc71;
}

p {
    font-size: 22px;
    font-weight: 600;
}

a {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 25px;
    text-decoration: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-radius: 10px;
    font-weight: 600;
}
a:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="card">
    <h1>Prediction</h1>

    {% if churn == 1 %}
        <p class="churn">{{ prediction }}</p>
    {% elif churn == 0 %}
        <p class="no-churn"> {{ prediction }}</p>
    {% else %}
        <p>{{ prediction }}</p>
    {% endif %}

    <a href="/">Predict </a>
    <button type="button" onclick="window.location.href='/'">
</button>

</div>

</body>
</html>
