<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Commerce Customer Churn Prediction</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: #fff;
    width: 100%;
    max-width: 850px;
    border-radius: 16px;
    padding: 30px 35px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

h2 {
    text-align: center;
    font-weight: 600;
    margin-bottom: 20px;
}

form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px 22px;
}

label {
    font-size: 13px;
    color: #555;
    margin-bottom: 5px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

input, select {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

input:focus, select:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 2px rgba(102,126,234,0.2);
}

.full {
    grid-column: span 2;
}

button {
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.result {
    margin-top: 15px;
    padding: 14px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    background: #f2f5ff;
    border-radius: 10px;
}

@media(max-width: 700px) {
    form {
        grid-template-columns: 1fr;
    }
    .full {
        grid-column: span 1;
    }
}
</style>
</head>

<body>

<div class="container">
<h2>🛒 E-Commerce Customer Churn Prediction</h2>

<form method="POST" action="/predict">


<!-- Numerical Inputs -->
<div class="form-group">
<label>City Tier</label>
<input type="number" name="CityTier" required>
</div>

<div class="form-group">
<label>Warehouse To Home Distance</label>
<input type="number" name="WarehouseToHome" required>
</div>

<div class="form-group">
<label>Hours Spent On App</label>
<input type="number" step="0.1" name="HourSpendOnApp" required>
</div>

<div class="form-group">
<label>Number Of Devices</label>
<input type="number" name="NumberOfDeviceRegistered" required>
</div>

<div class="form-group">
<label>Satisfaction Score</label>
<input type="number" name="SatisfactionScore" required>
</div>

<div class="form-group">
<label>Number Of Address</label>
<input type="number" name="NumberOfAddress" required>
</div>

<div class="form-group">
<label>Complain (0 or 1)</label>
<select name="Complain">
<option value="0">0 - No</option>
<option value="1">1 - Yes</option>
</select>
</div>

<div class="form-group">
<label>Order Amount Hike (%)</label>
<input type="number" step="0.1" name="OrderAmountHikeFromlastYear" required>
</div>

<div class="form-group">
<label>Coupon Used</label>
<input type="number" name="CouponUsed" required>
</div>

<div class="form-group">
<label>Order Count</label>
<input type="number" name="OrderCount" required>
</div>

<div class="form-group">
<label>Days Since Last Order</label>
<input type="number" name="DaySinceLastOrder" required>
</div>

<div class="form-group">
<label>Cashback Amount</label>
<input type="number" step="0.1" name="CashbackAmount" required>
</div>

<div class="form-group">
<label>Tenure (months)</label>
<input type="number" name="Tenure" required>
</div>

<!-- Categorical Inputs -->
<div class="form-group">
    <label>Gender</label>
    <select name="Gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
</div>




<div class="form-group">
    <label>Preferred Payment Mode</label>
    <select name="PreferredPaymentMode" required>
        <option value="">Select Payment Mode</option>
        <option value="COD">COD</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Debit Card">Debit Card</option>
        <option value="UPI">UPI</option>
        <option value="E-wallet">E-wallet</option>
    </select>
</div>


<div class="form-group">
    <label>Preferred Login Device</label>
    <select name="PreferredLoginDevice" required>
        <option value="">Select Device</option>
        <option value="Mobile">Mobile</option>
        <option value="Computer">Computer</option>
    </select>
</div>


<div class="form-group">
    <label>Preferred Order Category</label>
    <select name="PreferedOrderCat" required>
        <option value="">Select Category</option>
        <option value="Laptop">Laptop</option>
        <option value="Mobile">Mobile</option>
        <option value="Fashion">Fashion</option>
        <option value="Grocery">Grocery</option>
        <option value="Others">Others</option>
    </select>
</div>
<div class="form-group">
    <label>Marital Status</label>
    <select name="MaritalStatus" required>
        <option value="">Select Status</option>
        <option value="Single">Single</option>
        <option value="Married">Married</option>
        <option value="Divorced">Divorced</option>
    </select>
</div>
<div class="form-group">
<label>High Price (0 or 1)</label>
<select name="high_price" required>
<option value="0">0 - No</option>
<option value="1">1 - Yes</option>
</select>
</div>



<div class="full">
<button type="submit">🔍 Predict Churn</button>
</div>

{% if prediction %}
<div class="result full">
Prediction Result: {{ prediction }}
</div>
{% endif %}

</form>
</div>
<div><form method="POST" action="/predict">
    
</form>
</div>

</body>

</html>
